<svg viewBox="0 0 120 120" width="120" height="120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="solar-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e3f2fd" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#e3f2fd" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="solar-wafer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#42a5f5"/>
      <stop offset="40%" stop-color="#1e88e5"/>
      <stop offset="80%" stop-color="#0d47a1"/>
      <stop offset="100%" stop-color="#051b3b"/>
    </linearGradient>
    <linearGradient id="wafer-bevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#90caf9"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#45362a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <circle cx="60" cy="60" r="54" fill="url(#solar-glow)"/>
  <ellipse cx="60" cy="102" rx="38" ry="9" fill="#45362a" fill-opacity="0.2"/>

  <!-- Hexagonal Crystalline Solar Cell (Isometric Angled) -->
  <g filter="url(#soft-shadow)">
    <!-- Base Bevel Frame -->
    <polygon points="60,18 96,38 96,82 60,102 24,82 24,38" fill="url(#wafer-bevel)"/>
    <!-- Inner Wafer -->
    <polygon points="60,22 92,40 92,80 60,98 28,80 28,40" fill="url(#solar-wafer)"/>

    <!-- Photovoltaic Grid Silver Lines -->
    <!-- Horizontal Busbars -->
    <line x1="32" y1="48" x2="88" y2="48" stroke="#ffffff" stroke-width="1.2" opacity="0.75"/>
    <line x1="30" y1="60" x2="90" y2="60" stroke="#ffffff" stroke-width="2" opacity="0.9"/>
    <line x1="32" y1="72" x2="88" y2="72" stroke="#ffffff" stroke-width="1.2" opacity="0.75"/>

    <!-- Vertical Fingers -->
    <line x1="42" y1="33" x2="42" y2="87" stroke="#90caf9" stroke-width="1" opacity="0.6"/>
    <line x1="51" y1="27" x2="51" y2="93" stroke="#90caf9" stroke-width="1" opacity="0.6"/>
    <line x1="60" y1="24" x2="60" y2="96" stroke="#ffffff" stroke-width="2" opacity="0.9"/>
    <line x1="69" y1="27" x2="69" y2="93" stroke="#90caf9" stroke-width="1" opacity="0.6"/>
    <line x1="78" y1="33" x2="78" y2="87" stroke="#90caf9" stroke-width="1" opacity="0.6"/>

    <!-- Crystalline Anti-reflective Diagonal Glint -->
    <polygon points="36,36 68,22 44,70 28,60" fill="#ffffff" fill-opacity="0.22"/>
  </g>

  <!-- Brass Contact Terminals on Top & Bottom -->
  <circle cx="60" cy="22" r="4.5" fill="#ffd54f"/>
  <circle cx="60" cy="22" r="2.5" fill="#ff8f00"/>
  <circle cx="60" cy="98" r="4.5" fill="#ffd54f"/>
  <circle cx="60" cy="98" r="2.5" fill="#ff8f00"/>

  <!-- Energy Electric Spark -->
  <polygon points="76,46 86,40 82,52 94,50 78,68 82,56 74,58" fill="#ffeb3b"/>
  <circle cx="22" cy="34" r="2.5" fill="#90caf9"/>
</svg>
