<svg viewBox="0 0 120 120" width="120" height="120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="box-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8e1" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fff8e1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wood-box" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a07248"/>
      <stop offset="40%" stop-color="#7c5332"/>
      <stop offset="100%" stop-color="#54361e"/>
    </linearGradient>
    <linearGradient id="lid-wood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#be8c5c"/>
      <stop offset="100%" stop-color="#7c5332"/>
    </linearGradient>
    <linearGradient id="brass-bracket" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="50%" stop-color="#ffb300"/>
      <stop offset="100%" stop-color="#c67c00"/>
    </linearGradient>
    <linearGradient id="sprout-handle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#aed581"/>
      <stop offset="100%" stop-color="#558b2f"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#45362a" flood-opacity="0.3"/>
    </filter>
  </defs>

  <circle cx="60" cy="60" r="54" fill="url(#box-glow)"/>
  <ellipse cx="60" cy="103" rx="42" ry="10" fill="#45362a" fill-opacity="0.25"/>

  <!-- Wooden Spawner Chest -->
  <g filter="url(#soft-shadow)">
    <!-- Main Chest Box Body -->
    <rect x="24" y="52" width="72" height="46" rx="6" fill="url(#wood-box)"/>
    <!-- Planks Grooves -->
    <line x1="24" y1="68" x2="96" y2="68" stroke="#3e2723" stroke-width="2.5"/>
    <line x1="24" y1="84" x2="96" y2="84" stroke="#3e2723" stroke-width="2.5"/>

    <!-- Brass Corner Plates -->
    <!-- Top Left -->
    <polygon points="24,52 38,52 38,58 30,58 30,66 24,66" fill="url(#brass-bracket)"/>
    <circle cx="28" cy="56" r="1.5" fill="#5d4037"/>
    <!-- Top Right -->
    <polygon points="96,52 82,52 82,58 90,58 90,66 96,66" fill="url(#brass-bracket)"/>
    <circle cx="92" cy="56" r="1.5" fill="#5d4037"/>
    <!-- Bottom Left -->
    <polygon points="24,98 38,98 38,92 30,92 30,84 24,84" fill="url(#brass-bracket)"/>
    <circle cx="28" cy="94" r="1.5" fill="#5d4037"/>
    <!-- Bottom Right -->
    <polygon points="96,98 82,98 82,92 90,92 90,84 96,84" fill="url(#brass-bracket)"/>
    <circle cx="92" cy="94" r="1.5" fill="#5d4037"/>

    <!-- Chest Lid (Ajar, with golden light emerging) -->
    <!-- Golden Inner Light Spill -->
    <polygon points="28,52 92,52 90,44 30,44" fill="#ffee58" fill-opacity="0.9"/>
    
    <!-- Chest Lid Top -->
    <path d="M20 44 L26 32 C27 29 31 28 35 28 L85 28 C89 28 93 29 94 32 L100 44 Z" fill="url(#lid-wood)"/>
    <!-- Lid Highlights & Planks -->
    <line x1="26" y1="36" x2="94" y2="36" stroke="#d7ccc8" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

    <!-- Brass Front Latch / Padlock Plate -->
    <rect x="52" y="44" width="16" height="20" rx="3" fill="url(#brass-bracket)"/>
    <circle cx="60" cy="54" r="3.5" fill="#5d4037"/>
    <polygon points="59,54 61,54 62,60 58,60" fill="#5d4037"/>

    <!-- Cute Leafy Handle on Lid -->
    <path d="M60 28 C56 22 52 14 60 10 C68 14 64 22 60 28 Z" fill="url(#sprout-handle)"/>
    <path d="M60 10 Q60 20 60 28" stroke="#dcedc8" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Sparkles & Magic Seed Spores -->
  <polygon points="60,2 62,6 66,7 62,8 60,12 58,8 54,7 58,6" fill="#ffd54f"/>
  <circle cx="16" cy="40" r="2.5" fill="#fff59d"/>
  <circle cx="104" cy="46" r="2.2" fill="#81c784"/>
  <circle cx="78" cy="18" r="1.8" fill="#ffd54f"/>
</svg>
