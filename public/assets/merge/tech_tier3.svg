<svg viewBox="0 0 120 120" width="120" height="120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="battery-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e0f2f1" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#e0f2f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="battery-casing" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4db6ac"/>
      <stop offset="35%" stop-color="#00897b"/>
      <stop offset="70%" stop-color="#00695c"/>
      <stop offset="100%" stop-color="#004d40"/>
    </linearGradient>
    <linearGradient id="battery-metal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cfd8dc"/>
      <stop offset="40%" stop-color="#eceff1"/>
      <stop offset="70%" stop-color="#b0bec5"/>
      <stop offset="100%" stop-color="#78909c"/>
    </linearGradient>
    <linearGradient id="brass-terminal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="50%" stop-color="#ffb300"/>
      <stop offset="100%" stop-color="#ff8f00"/>
    </linearGradient>
    <linearGradient id="led-charge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b2ff59"/>
      <stop offset="100%" stop-color="#64dd17"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#45362a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <circle cx="60" cy="60" r="54" fill="url(#battery-glow)"/>
  <ellipse cx="60" cy="104" rx="36" ry="9" fill="#45362a" fill-opacity="0.22"/>

  <!-- Bio-Battery Capacitor Cell -->
  <g filter="url(#soft-shadow)">
    <!-- Top Brass Terminal Cap -->
    <rect x="52" y="16" width="16" height="7" rx="3.5" fill="url(#brass-terminal)"/>
    <ellipse cx="60" cy="16" rx="8" ry="3" fill="#ffe082"/>

    <!-- Top Metal Collar -->
    <rect x="36" y="22" width="48" height="12" rx="4" fill="url(#battery-metal)"/>
    <ellipse cx="60" cy="22" rx="24" ry="6" fill="#eceff1"/>

    <!-- Main Battery Body -->
    <rect x="36" y="32" width="48" height="58" fill="url(#battery-casing)"/>
    
    <!-- Bottom Metal Base -->
    <path d="M36 88 L36 94 C36 99 44 102 60 102 C76 102 84 99 84 94 L84 88 Z" fill="url(#battery-metal)"/>
    <ellipse cx="60" cy="88" rx="24" ry="6" fill="#004d40"/>

    <!-- Gloss Specular Highlight Tube -->
    <rect x="42" y="32" width="6" height="56" fill="#ffffff" fill-opacity="0.28" rx="3"/>

    <!-- Illuminated LED Charge Level Bars -->
    <rect x="51" y="42" width="18" height="6" rx="2.5" fill="url(#led-charge)"/>
    <rect x="51" y="52" width="18" height="6" rx="2.5" fill="url(#led-charge)"/>
    <rect x="51" y="62" width="18" height="6" rx="2.5" fill="url(#led-charge)"/>
    <rect x="51" y="72" width="18" height="6" rx="2.5" fill="#004d40" stroke="#00897b" stroke-width="1"/>

    <!-- Eco Leaf Emblem -->
    <path d="M60 40 C63 45 63 50 60 54 C57 50 57 45 60 40 Z" fill="#ffffff" fill-opacity="0.6"/>
  </g>

  <!-- Pulsing Charge Sparks -->
  <polygon points="26,42 32,38 30,46 38,44 28,56 30,48 24,50" fill="#ffd54f"/>
  <circle cx="92" cy="50" r="2.5" fill="#69f0ae"/>
  <circle cx="86" cy="36" r="1.8" fill="#ffffff"/>
</svg>
