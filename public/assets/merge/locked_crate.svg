<svg viewBox="0 0 120 120" width="120" height="120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardboard-box" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfc09f"/>
      <stop offset="50%" stop-color="#be9a77"/>
      <stop offset="100%" stop-color="#937250"/>
    </linearGradient>
    <linearGradient id="cardboard-top" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#edd5ba"/>
      <stop offset="100%" stop-color="#be9a77"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#45362a" flood-opacity="0.3"/>
    </filter>
  </defs>

  <ellipse cx="60" cy="103" rx="40" ry="10" fill="#45362a" fill-opacity="0.25"/>

  <!-- Cardboard / Wooden Crate Body -->
  <g filter="url(#soft-shadow)">
    <!-- Box Front & Sides -->
    <rect x="25" y="45" width="70" height="52" rx="5" fill="url(#cardboard-box)"/>
    <!-- Fold Flaps Details -->
    <line x1="25" y1="45" x2="60" y2="60" stroke="#7e5f3f" stroke-width="2"/>
    <line x1="95" y1="45" x2="60" y2="60" stroke="#7e5f3f" stroke-width="2"/>
    <line x1="60" y1="60" x2="60" y2="97" stroke="#7e5f3f" stroke-width="2.5"/>

    <!-- Top Flaps Isometric -->
    <polygon points="25,45 60,30 95,45 60,60" fill="url(#cardboard-top)"/>

    <!-- Recycle Tape Across -->
    <polygon points="53,33 67,27 67,97 53,97" fill="#8d6e53" fill-opacity="0.5"/>

    <!-- Green Stamp Badge -->
    <circle cx="75" cy="76" r="10" fill="#588157" fill-opacity="0.4"/>
    <text x="75" y="80" font-family="sans-serif" font-weight="900" font-size="11" text-anchor="middle" fill="#ffffff" opacity="0.8">?</text>
  </g>

  <!-- Delicate Cobwebs & Mystery Threads (as shown in reference image!) -->
  <!-- Top-Left Web -->
  <path d="M22 40 Q40 45 42 28 M22 48 Q44 52 48 33 M22 56 Q50 60 55 38" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.75"/>
  <line x1="22" y1="36" x2="52" y2="48" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
  <line x1="32" y1="32" x2="40" y2="58" stroke="#ffffff" stroke-width="1" opacity="0.6"/>

  <!-- Bottom-Right Web -->
  <path d="M98 75 Q80 72 78 88 M98 67 Q74 65 72 82 M98 60 Q68 58 65 76" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.75"/>
  <line x1="98" y1="78" x2="68" y2="68" stroke="#ffffff" stroke-width="1" opacity="0.6"/>

  <!-- Ivy Leaves Clinging to Crate -->
  <path d="M22 65 C26 62 30 65 31 70 C28 72 23 70 22 65 Z" fill="#60994a"/>
  <path d="M92 84 C88 82 86 86 85 90 C89 91 93 88 92 84 Z" fill="#74a85c"/>
</svg>
