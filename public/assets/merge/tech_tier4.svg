<svg viewBox="0 0 120 120" width="120" height="120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="grid-core-aurora" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#80d8ff"/>
      <stop offset="70%" stop-color="#00b0ff"/>
      <stop offset="100%" stop-color="#00b0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tower-metal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cfd8dc"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#90a4ae"/>
    </linearGradient>
    <linearGradient id="solar-wing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#29b6f6"/>
      <stop offset="60%" stop-color="#0277bd"/>
      <stop offset="100%" stop-color="#01579b"/>
    </linearGradient>
    <linearGradient id="generator-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#37474f"/>
      <stop offset="50%" stop-color="#263238"/>
      <stop offset="100%" stop-color="#102027"/>
    </linearGradient>
    <filter id="core-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00e5ff" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#45362a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <circle cx="60" cy="54" r="54" fill="url(#grid-core-aurora)" opacity="0.8"/>
  <ellipse cx="60" cy="105" rx="42" ry="9" fill="#45362a" fill-opacity="0.25"/>

  <!-- High-Tech Pedestal Platform -->
  <g>
    <path d="M26 86 L34 102 C35 104 38 105 42 105 L78 105 C82 105 85 104 86 102 L94 86 Z" fill="url(#generator-base)"/>
    <ellipse cx="60" cy="86" rx="34" ry="7.5" fill="#455a64"/>
    <ellipse cx="60" cy="86" rx="30" ry="5.5" fill="#1c313a"/>
    <!-- Glowing Status Rings on Base -->
    <ellipse cx="60" cy="86" rx="20" ry="3.5" fill="none" stroke="#00e5ff" stroke-width="1.8" opacity="0.8"/>
  </g>

  <!-- Dual Angled Solar Wings -->
  <!-- Left Solar Wing -->
  <polygon points="12,58 38,64 38,78 12,70" fill="url(#solar-wing)"/>
  <line x1="12" y1="58" x2="38" y2="78" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
  <line x1="25" y1="61" x2="25" y2="74" stroke="#ffffff" stroke-width="1" opacity="0.7"/>
  <!-- Right Solar Wing -->
  <polygon points="108,58 82,64 82,78 108,70" fill="url(#solar-wing)"/>
  <line x1="108" y1="58" x2="82" y2="78" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
  <line x1="95" y1="61" x2="95" y2="74" stroke="#ffffff" stroke-width="1" opacity="0.7"/>

  <!-- Central Sleek White Pylon Mast -->
  <polygon points="56,86 57,36 63,36 64,86" fill="url(#tower-metal)"/>

  <!-- Glowing Bio-Energy Plasma Core Orb -->
  <g filter="url(#core-glow)">
    <circle cx="60" cy="62" r="14" fill="#00e5ff"/>
    <circle cx="60" cy="62" r="10" fill="#ffffff"/>
    <!-- Orb Internal Rings -->
    <ellipse cx="60" cy="62" rx="13" ry="5" fill="none" stroke="#0091ea" stroke-width="1.5" transform="rotate(30 60 62)"/>
    <ellipse cx="60" cy="62" rx="13" ry="5" fill="none" stroke="#0091ea" stroke-width="1.5" transform="rotate(-30 60 62)"/>
  </g>

  <!-- Top Wind Turbine Nacelle & 3 Aerodynamic Blades -->
  <g filter="url(#core-glow)">
    <!-- Nacelle Hub -->
    <circle cx="60" cy="34" r="7" fill="url(#tower-metal)"/>
    <circle cx="60" cy="34" r="4.5" fill="#00e5ff"/>

    <!-- Blade 1 (Pointing Up) -->
    <path d="M60 34 C58 26 56 12 60 6 C64 12 62 26 60 34 Z" fill="#ffffff"/>
    <!-- Blade 2 (Pointing Bottom-Right) -->
    <path d="M60 34 C67 36 78 44 83 48 C78 51 66 42 60 34 Z" fill="#eceff1"/>
    <!-- Blade 3 (Pointing Bottom-Left) -->
    <path d="M60 34 C53 36 42 44 37 48 C42 51 54 42 60 34 Z" fill="#cfd8dc"/>
  </g>

  <!-- Energy Radiation Pulses & Stars -->
  <circle cx="60" cy="62" r="22" fill="none" stroke="#00e5ff" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
  <polygon points="86,18 89,24 95,27 89,30 86,36 83,30 77,27 83,24" fill="#ffffff"/>
  <circle cx="34" cy="22" r="2.2" fill="#ffd54f"/>
  <circle cx="98" cy="80" r="2" fill="#00e5ff"/>
</svg>
